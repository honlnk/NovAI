<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 160" role="img" aria-label="NovAI">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- 图标瓦片：翻开的书 + 灯泡光芒（Vibe Writing） -->
  <g transform="translate(0,8)">
    <rect width="144" height="144" rx="35" fill="#18181B"/>
    <g transform="translate(22,30.5) scale(2.08)">
      <g stroke="url(#acc)" stroke-width="2.4" stroke-linecap="round">
        <path d="M 11.5 1.5 L 8.5 -1.5"/>
        <path d="M 36.5 1.5 L 39.5 -1.5"/>
      </g>
      <rect x="22.8" y="-8" width="2.4" height="4" rx="1.2" fill="url(#acc)"/>
      <circle cx="24" cy="8.5" r="7.5" fill="url(#acc)"/>
      <rect x="20.5" y="15.5" width="7" height="2.2" rx="1.1" fill="url(#acc)"/>
      <rect x="21.5" y="19" width="5" height="2" rx="1" fill="url(#acc)"/>
      <path fill="#FAFAF9" d="M 22.6 26 C 18 22.4, 10.5 21.4, 5 23.2 L 5 41 C 10.5 39.2, 18 40.2, 22.6 43.8 Z"/>
      <path fill="#FAFAF9" d="M 25.4 26 C 30 22.4, 37.5 21.4, 43 23.2 L 43 41 C 37.5 39.2, 30 40.2, 25.4 43.8 Z"/>
    </g>
  </g>

  <!-- 字标：光学字距（视觉等距，非机械等距）——o-v 收紧补开口、A-I 拉开、o/A overshoot -->
  <g transform="translate(184,26)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
    <g stroke="#18181B">
      <path d="M 6 12 L 6 108"/>
      <path d="M 6 12 L 44 108"/>
      <path d="M 44 12 L 44 108"/>
      <!-- o overshoot：半径略大，视觉与其他字母同高 -->
      <circle cx="82" cy="73" r="25"/>
      <!-- v 左移收紧 o-v（光学字距，比基准再近） -->
      <path d="M 113 42 L 132 108 L 151 42"/>
    </g>
    <!-- A 左移收紧 v-A、尖顶 overshoot（上超 2px） -->
    <path d="M 169 108 L 192 10 L 215 108" stroke="url(#acc)"/>
    <rect x="177" y="78" width="30" height="9" rx="4.5" fill="url(#acc)"/>
    <!-- I 略右移：两直线间空白需更松 -->
    <rect x="238.5" y="12" width="9" height="96" rx="4.5" fill="url(#acc)"/>
  </g>
</svg>
